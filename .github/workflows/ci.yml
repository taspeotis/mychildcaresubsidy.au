name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch (e.g. a dependabot force-push).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tracks the current Node LTS rather than pinning a major, so CI doesn't
      # drift onto an end-of-life runtime between manual bumps.
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # Type-checks with `tsc -b` before Vite builds.
      - run: npm run build

      - run: npm test
